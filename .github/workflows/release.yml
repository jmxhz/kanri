name: 'Create Release'

on:
  push:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-kanri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    outputs:
      upload_url: ${{ steps.release.outputs.releaseUploadUrl }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: |
          yarn cache clean
          yarn config delete proxy
          yarn config delete https-proxy
          yarn config delete registry
          yarn install --network-timeout 1000000 --frozen-lockfile

      - name: Build frontend
        run: yarn generate

      - name: Override linuxdeploy version (potential Linux fix)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Pin linuxdeploy version to prevent @tauri-apps/cli-linux-x64-gnu from pulling in an outdated version
          TAURI_TOOLKIT_PATH="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLKIT_PATH"
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage -O "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"

        
      - uses: tauri-apps/tauri-action@v0
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'Kanri v__VERSION__'
          releaseBody: |
            Kanri 0.8.3 覆盖发布

            这是针对 0.8.3 的体验修正包，版本号保持不变。本次发布只提供 Windows x64 安装包。

            更新内容：
            - 看板卡片现在会在底部显示创建时间，便于快速判断任务记录的产生时间。
            - 当卡片内所有任务都完成时，卡片会根据最晚完成的任务显示完成时间；旧数据缺少时间字段时会自动跳过，不影响打开和使用。
            - 卡片详情弹窗移除了任务里的 Task due/check time 输入，避免出现不需要的 check time / checkdata 类字段。
            - 卡片详情弹窗做了轻量 UI 收敛：整体略加宽，任务列表可用高度更充足，内边距更紧凑，同时保留原有操作方式。
            - 修复了详情弹窗中创建时间文案显示异常的问题。

            安装说明：
            - Windows 用户可下载 .msi 或 x64-setup.exe 安装包。
            - 本次没有变更数据结构，也不会补写旧数据时间字段；旧卡片和旧任务会继续兼容。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

