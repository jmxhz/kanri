name: 'Create Release'

on:
  push:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-kanri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc --bundles msi nsis'

    runs-on: ${{ matrix.platform }}
    outputs:
      upload_url: ${{ steps.release.outputs.releaseUploadUrl }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install frontend dependencies
        run: |
          yarn cache clean
          yarn config delete proxy
          yarn config delete https-proxy
          yarn config delete registry
          yarn install --network-timeout 1000000 --frozen-lockfile

      - name: Build frontend
        run: yarn generate

      - uses: tauri-apps/tauri-action@v0
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Kanri v__VERSION__'
          releaseBody: |
            Kanri 0.8.4 release

            This release rebuilds 0.8.4 from the current 0.8.3 release baseline and only publishes Windows x64 installers.

            Changes:
            - Card descriptions and task content now support embedded image and file objects.
            - Images and files are inserted into the content flow, selectable as whole objects, and removable as whole objects.
            - New attachment files are copied into the app data directory under each board's Kanri asset folder; original user file paths are not stored in board JSON.
            - Images use fixed thumbnails, while files render as file blocks with extension and filename.
            - Double-clicking an image or file opens it with the system default application.
            - Subtasks and per-task due dates were removed from the task model, editor, preview statistics, and copy/move paths.
            - Old Kanri JSON data remains import-compatible; old subtasks and task due dates are ignored and stripped on normalization/save.
            - Board copy, card copy, and cross-board card moves copy referenced assets into the target board folder.
            - Kanri exports can now include JSON plus assets in a zip bundle. JSON-only export remains available.
            - The asset management page now shows board assets, missing files, open/locate actions, and deletion for unreferenced files.

            Install:
            - Windows users can download either the MSI installer or the NSIS setup executable.
            - This release does not provide macOS, Linux, ARM, or other platform artifacts.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
